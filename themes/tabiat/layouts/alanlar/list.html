{{ define "main" }}
<div class="explore-page">
    <!-- Hero Section -->
    <div class="explore-hero">
        <div class="container">
            <div class="explore-hero-content">
                <h1 class="explore-title">Türkiye'nin Doğal Alanları</h1>
                <p class="explore-subtitle">
                    Türkiye'nin en güzel doğal alanlarını keşfedin. İl, tür veya isimle filtreleyerek arama yapabilirsiniz.
                </p>
            </div>
        </div>
    </div>

    <!-- Breadcrumb -->
    <div class="breadcrumb-section">
        <div class="container">
            <nav class="breadcrumb" aria-label="Breadcrumb">
                <a href="/">
                    <i data-lucide="home" style="width: 16px; height: 16px;"></i>
                    <span>Ana Sayfa</span>
                </a>
                <i data-lucide="chevron-right" style="width: 14px; height: 14px;"></i>
                <span class="current">Tüm Alanlar</span>
            </nav>
        </div>
    </div>

    <!-- Filters Section -->
    <div class="explore-filters-section">
        <div class="container">
            <div class="explore-filters-card">
                <div class="filters-header">
                    <i data-lucide="sliders"></i>
                    <h3>Filtrele ve Keşfet</h3>
                </div>

                <div class="filters-grid">
                    <!-- İl Filtresi -->
                    <div class="filter-item">
                        <label for="provinceFilter">
                            <i data-lucide="map-pin"></i>
                            <span>İl</span>
                        </label>
                        <select id="provinceFilter" class="filter-select">
                            <option value="">Tüm İller</option>
                            {{ $provinces := slice }}
                            {{ range where .Site.RegularPages "Type" "alan" }}
                                {{ if .Params.il }}
                                    {{ $provinces = $provinces | append .Params.il }}
                                {{ end }}
                            {{ end }}
                            {{ range (uniq $provinces | sort) }}
                            <option value="{{ . }}">{{ . }}</option>
                            {{ end }}
                        </select>
                    </div>

                    <!-- Tür Filtresi -->
                    <div class="filter-item">
                        <label for="typeFilter">
                            <i data-lucide="layers"></i>
                            <span>Alan Türü</span>
                        </label>
                        <select id="typeFilter" class="filter-select">
                            <option value="">Tüm Türler</option>
                            <option value="ada">Ada</option>
                            <option value="dag">Dağ</option>
                            <option value="gol">Göl</option>
                            <option value="kanyon">Kanyon</option>
                            <option value="magara">Mağara</option>
                            <option value="milli-park">Milli Park</option>
                            <option value="tabiat-parki">Tabiat Parkı</option>
                            <option value="selalesi">Şelale</option>
                            <option value="plaj">Plaj</option>
                            <option value="sulak-alan">Sulak Alan</option>
                            <option value="tabiat-aniti">Tabiat Anıtı</option>
                            <option value="jeopark">Jeopark</option>
                            <option value="botanik-bahcesi">Botanik Bahçesi</option>
                            <option value="kayak-merkezi">Kayak Merkezi</option>
                            <option value="kus-cenneti">Kuş Cenneti</option>
                            <option value="orman">Orman</option>
                            <option value="tepe">Tepe</option>
                            <option value="termal-kaynak">Termal Kaynak</option>
                            <option value="vadi">Vadi</option>
                            <option value="yayla">Yayla</option>
                        </select>
                    </div>

                    <!-- Arama -->
                    <div class="filter-item filter-item-search">
                        <label for="searchFilter">
                            <i data-lucide="search"></i>
                            <span>Ara</span>
                        </label>
                        <input type="text" id="searchFilter" class="filter-input" placeholder="Alan adı ile ara...">
                    </div>

                    <!-- Temizle Butonu -->
                    <div class="filter-item filter-item-button">
                        <button id="clearFilters" class="filter-clear-btn">
                            <i data-lucide="x"></i>
                            <span>Temizle</span>
                        </button>
                    </div>
                </div>

                <!-- Sonuç Sayısı -->
                <div id="filterResults" class="filter-results">
                    <i data-lucide="info"></i>
                    <span id="resultCount">Yükleniyor...</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Areas Grid (JS-driven) -->
    <div class="explore-content">
        <div class="container">
            <div id="areasGrid" class="areas-grid">
                <div id="loadingState" style="grid-column:1/-1;text-align:center;padding:3rem;color:#666;">
                    <i data-lucide="loader" style="width:32px;height:32px;"></i>
                    <p>Alanlar yükleniyor...</p>
                </div>
            </div>

            <!-- JS Pagination -->
            <nav id="jsPagination" class="pagination" style="display:none;"></nav>
        </div>
    </div>
</div>

<script>
(function() {
    'use strict';

    const PER_PAGE = 24;
    let allAreas   = [];
    let filtered   = [];
    let currentPage = 1;

    const grid       = document.getElementById('areasGrid');
    const pagination = document.getElementById('jsPagination');
    const countEl    = document.getElementById('resultCount');
    const loading    = document.getElementById('loadingState');

    const provSel    = document.getElementById('provinceFilter');
    const typeSel    = document.getElementById('typeFilter');
    const searchInp  = document.getElementById('searchFilter');
    const clearBtn   = document.getElementById('clearFilters');

    // Turkish text normalisation
    const TR = {'ç':'c','ğ':'g','ı':'i','ö':'o','ş':'s','ü':'u','Ç':'c','Ğ':'g','İ':'i','Ö':'o','Ş':'s','Ü':'u'};
    function norm(s){ return (s||'').toLowerCase().replace(/[çğışöüÇĞİŞÖÜ]/g, c => TR[c]||c); }

    // Type label map
    const TYPE_LABELS = {
        'ada':'Ada','dag':'Dağ','gol':'Göl','kanyon':'Kanyon','magara':'Mağara',
        'milli-park':'Milli Park','tabiat-parki':'Tabiat Parkı','selalesi':'Şelale',
        'plaj':'Plaj','sulak-alan':'Sulak Alan','tabiat-aniti':'Tabiat Anıtı',
        'jeopark':'Jeopark','botanik-bahcesi':'Botanik Bahçesi','kayak-merkezi':'Kayak Merkezi',
        'kus-cenneti':'Kuş Cenneti','orman':'Orman','tepe':'Tepe',
        'termal-kaynak':'Termal Kaynak','vadi':'Vadi','yayla':'Yayla'
    };

    function buildCard(a) {
        const typeLabel = TYPE_LABELS[a.type] || a.type || 'Doğal Alan';
        const imgHtml = a.image
            ? `<div class="area-card-image"><img src="${a.image}" alt="${escHtml(a.title)}" loading="lazy"><div class="area-card-overlay"><span class="area-card-type">${escHtml(typeLabel)}</span></div></div>`
            : `<div class="area-card-image area-card-placeholder"><svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></div>`;
        const loc = a.province + (a.district ? ', ' + a.district : '');
        const desc = a.description ? `<p class="area-card-desc">${escHtml(a.description.substring(0,100))}</p>` : '';
        return `<a href="${a.url}" class="area-card">${imgHtml}<div class="area-card-content"><h3 class="area-card-title">${escHtml(a.title)}</h3><p class="area-card-location"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>${escHtml(loc)}</p>${desc}</div></a>`;
    }

    function escHtml(s){
        return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function applyFilters() {
        const prov   = provSel.value;
        const type   = typeSel.value;
        const search = norm(searchInp.value.trim());

        filtered = allAreas.filter(a => {
            if (prov   && a.province !== prov) return false;
            if (type   && a.type     !== type)  return false;
            if (search && !norm(a.title).includes(search)) return false;
            return true;
        });

        currentPage = 1;
        render();
    }

    function render() {
        const total = filtered.length;
        const totalPages = Math.ceil(total / PER_PAGE);
        const start = (currentPage - 1) * PER_PAGE;
        const pageItems = filtered.slice(start, start + PER_PAGE);

        // Cards
        grid.innerHTML = pageItems.length
            ? pageItems.map(buildCard).join('')
            : '<p style="grid-column:1/-1;text-align:center;padding:3rem;color:#666;">Sonuç bulunamadı.</p>';

        // Count
        countEl.textContent = total + ' alan bulundu';

        // Pagination
        if (totalPages <= 1) { pagination.style.display = 'none'; return; }
        pagination.style.display = 'flex';
        let html = '';

        if (currentPage > 1) html += `<button class="pagination-btn pagination-prev" data-p="${currentPage-1}"><span>Önceki</span></button>`;

        const delta = 2;
        const left  = currentPage - delta;
        const right = currentPage + delta;

        if (left > 2) html += `<button class="pagination-number" data-p="1">1</button><span class="pagination-ellipsis">…</span>`;
        else if (left === 2) html += `<button class="pagination-number" data-p="1">1</button>`;

        for (let p = Math.max(1, left); p <= Math.min(totalPages, right); p++) {
            html += `<button class="pagination-number${p===currentPage?' active':''}" data-p="${p}">${p}</button>`;
        }

        if (right < totalPages - 1) html += `<span class="pagination-ellipsis">…</span><button class="pagination-number" data-p="${totalPages}">${totalPages}</button>`;
        else if (right === totalPages - 1) html += `<button class="pagination-number" data-p="${totalPages}">${totalPages}</button>`;

        if (currentPage < totalPages) html += `<button class="pagination-btn pagination-next" data-p="${currentPage+1}"><span>Sonraki</span></button>`;

        pagination.innerHTML = html;
        pagination.querySelectorAll('[data-p]').forEach(btn => {
            btn.addEventListener('click', () => {
                currentPage = parseInt(btn.dataset.p);
                render();
                window.scrollTo({ top: grid.offsetTop - 80, behavior: 'smooth' });
            });
        });

        // Re-init lucide icons if available
        if (window.lucide) lucide.createIcons();
    }

    // Fetch JSON index
    fetch('/index.json')
        .then(r => r.json())
        .then(data => {
            allAreas = data;
            filtered = data;
            loading.remove();
            render();
        })
        .catch(() => {
            loading.innerHTML = '<p style="color:#c00;">Alanlar yüklenemedi. Lütfen sayfayı yenileyin.</p>';
        });

    // Events
    provSel.addEventListener('change', applyFilters);
    typeSel.addEventListener('change', applyFilters);
    searchInp.addEventListener('input', applyFilters);
    clearBtn.addEventListener('click', () => {
        provSel.value = '';
        typeSel.value = '';
        searchInp.value = '';
        applyFilters();
    });
})();
</script>
{{ end }}
